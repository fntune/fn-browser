name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    # Linux. Build, typecheck, lint and test need no Darwin toolchain, and a macOS runner bills
    # at ten times the Linux rate. The release workflow still uses macos-14, where it must.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build, Typecheck, Lint, Test
        run: bun run ci
